<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You – Varnya Wellness</title>

    <!-- Optional: Meta Description for search -->
    <meta name="description"
        content="Thank you for contacting Varnya Wellness. We’ve received your message and will get back to you soon.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/images/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="./styles/styles.css">

    <style>
        .thank-you-section {
            padding: 180px 6% 100px;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .thank-you-content {
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
            max-width: 700px;
            width: 100%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(127, 168, 111, 0.15);
            color: var(--sage);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 30px;
        }
    </style>

</head>

<body class="light-hero">

    <!-- NAVIGATION -->
    <div id="header-placeholder"></div>

    <!-- MAIN CONTENT -->
    <section class="thank-you-section">
        <div class="thank-you-content">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <h1 style="font-family: 'Cormorant', serif; font-size: 3rem; margin-bottom: 20px; color: var(--charcoal);">
                Thank You!</h1>
            <p style="font-size: 1.1rem; color: #5a5a5a; margin-bottom: 40px; line-height: 1.6;">Your message has been
                successfully sent. Our team has received your inquiry and will get back to you shortly.</p>
            <a href="https://www.varnyawellness.com/" class="btn-primary">Return to Home <i
                    class="fas fa-arrow-right"></i></a>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Custom Script -->
    <script src="./scripts/includes.js"></script>
    <script src="./scripts/script.js"></script>

</body>

</html>
